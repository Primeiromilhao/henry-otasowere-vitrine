name: Sync new social videos
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: social-video-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Sync only new videos
        run: python social_sync.py
      - name: Commit new catalog entries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json videos-facebook.json videos-tiktok.json social-monitor-state.json
          if git diff --cached --quiet; then echo "No catalog changes."; exit 0; fi
          git commit -m "Atualizar catálogo com novos vídeos das plataformas"
          git push
